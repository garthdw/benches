[package]
name = "benches-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/platform.rs"

[dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSError",
  "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

# Rune's D-Bus stack, zbus 5 over async-io, so Linux builds compile one zbus. Each D-Bus user
# blocks on its futures on its own thread.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
async-io = "2"
async-channel = "2"
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
