[package]
name = "benches"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
benches-core.workspace = true
benches-font.workspace = true
benches-platform.workspace = true
rune = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0", features = [
  "native-file-dialog",
] }
libghostty-vt.workspace = true
wgpu = { version = "~30.0.2", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel.workspace = true
libc.workspace = true
nix.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# Rune's headless flags (`--snap`, `--scene`) in a release build.
tooling = ["rune/tooling"]
# The fontique, harfrust and swash font backend on macOS, for comparing it against CoreText.
swash = ["benches-font/swash"]

[dev-dependencies]
benches-core = { workspace = true, features = ["test-support"] }
benches-font = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
benches-core = { path = "crates/benches-core" }
benches-font = { path = "crates/benches-font" }
benches-platform = { path = "crates/benches-platform" }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", features = [
  "png",
] }
anyhow = "1.0.104"
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.32", features = ["term", "fs", "signal", "poll", "hostname", "user"] }
objc2-core-foundation = "0.3"
# The swash font backend, matching Rune's text stack so no new crates enter the lockfile.
fontique = { version = "0.12", default-features = false, features = [
  "std",
  "system",
  "fontconfig-dlopen",
] }
harfrust = "0.12"
skrifa = "0.44"
swash = "0.2.10"
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tempfile = "3.27.0"

# Rune's vendored copies (its macOS IME calls need its winit, and its winit's Wayland frame needs
# its sctk-adwaita); a dependency's `[patch]` doesn't reach the app's workspace. The wgpu-hal and
# accesskit_windows patches are Windows-only.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
winit = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

# Cargo passes `DEBUG=true` when any debug info is on, which builds libghostty in Zig's Debug mode.
[profile.release.package.libghostty-vt-sys]
debug = false
