[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7dfaa8fb1fa8281e6e2ccc92568d95262e9c6f3c", features = [
  "native-file-dialog",
] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf", features = ["png"] }
wgpu = { version = "~30.0.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.31", features = ["term", "fs", "signal", "poll", "hostname", "user"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
toml_edit = "0.25.19"
serde_json = "1.0.154"
toml = "1.2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSError",
  "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

# Cargo passes `DEBUG=true` when any debug info is on, which builds libghostty in Zig's Debug mode.
[profile.release.package.libghostty-vt-sys]
debug = false
