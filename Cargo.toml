[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ba5e7c8069a24c36f95ca90a3058083cd468fcd1", features = [
  "native-file-dialog",
] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "635b1cc037e66ebb83c9fa39db782b77cd15014d" }
wgpu = { version = "~30.0.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.31", features = ["term", "fs", "signal", "poll"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
toml_edit = "0.25.19"
serde_json = "1.0.154"
toml = "1.2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSError",
  "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

# Cargo passes `DEBUG=true` when any debug info is on, which builds libghostty in Zig's Debug mode.
[profile.release.package.libghostty-vt-sys]
debug = false
