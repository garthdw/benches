[package]
name = "benches"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040", features = [
  "native-file-dialog",
] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", features = [
  "png",
] }
wgpu = { version = "~30.0.2", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.23.1"
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.32", features = ["term", "fs", "signal", "poll", "hostname", "user"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
toml_edit = "0.25.19"
serde_json = "1.0.154"
toml = "1.2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSError",
  "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[features]
# Rune's headless flags (`--snap`, `--scene`) in a release build.
tooling = ["rune/tooling"]

[dev-dependencies]
tempfile = "3.27.0"

# Rune's vendored copies (its macOS IME calls need its winit); a dependency's `[patch]` doesn't
# reach the app's workspace. The wgpu-hal and accesskit_windows patches are Windows-only.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
winit = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

# Cargo passes `DEBUG=true` when any debug info is on, which builds libghostty in Zig's Debug mode.
[profile.release.package.libghostty-vt-sys]
debug = false
