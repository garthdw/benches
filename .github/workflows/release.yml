name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # libghostty-vt builds with zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      # The tag's `v` is stripped so the bundle version reads like Cargo's.
      - run: BENCHES_VERSION="${GITHUB_REF_NAME#v}" scripts/bundle

      # ditto keeps the bundle's signature and symlinks intact, which zip does not.
      - run: |
          archive="benches-${GITHUB_REF_NAME}-aarch64-apple-darwin.zip"
          ditto -c -k --keepParent target/release/benches.app "$archive"
          gh release upload --clobber "$GITHUB_REF_NAME" "$archive"

      # The app is not notarized, so Gatekeeper blocks a downloaded copy until it is allowed.
      # The marker keeps a rerun from appending the note twice.
      - run: |
          notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          case "$notes" in *"<!-- install -->"*) exit 0 ;; esac
          gh release edit "$GITHUB_REF_NAME" --notes "$notes

          <!-- install -->
          ## Install

          Unzip and move \`benches.app\` to \`~/Applications\` or \`/Applications\`. The app is not notarized, so macOS blocks the first launch: open it once, then choose **Open Anyway** in System Settings → Privacy & Security, or run:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/benches.app
          \`\`\`"
