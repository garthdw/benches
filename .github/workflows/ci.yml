name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Any OS cfg can select macOS code, as an `else` or a `not(...)`. Listed files must exist,
      # so a renamed one isn't silently dropped.
      - name: Check the filter lists every file with an OS cfg
        shell: bash
        run: |
          listed=$(sed -n "s/^  - //p" .github/macos-paths.yml | sed "s/ *#.*//; s/^'//; s/'\$//")
          with_cfg=$(git grep -lE 'target_(os|vendor) = "(macos|linux|apple)"' -- '*.rs')
          missing=$(grep -vxF -f <(echo "$listed") <<<"$with_cfg" || true)
          stale=$(grep -v '\*' <<<"$listed" | while read -r path; do
            [ -e "$path" ] || echo "$path"
          done)
          if [ -n "$missing$stale" ]; then
            [ -z "$missing" ] || echo "::error::Add to .github/macos-paths.yml:" $missing
            [ -z "$stale" ] || echo "::error::Not found, from .github/macos-paths.yml:" $stale
            exit 1
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/macos-paths.yml

  # `test` is the check the `main` ruleset requires, and a skipped job counts as passing. Pushes
  # to `main` and manual runs always test on macOS, as does a PR whose `changes` job failed, such
  # as when the filter misses a file.
  test:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # libghostty-vt builds with zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      # Tests use the default shell and font, and the Nerd Font `font.rs` draws icons with.
      - run: brew install font-monaspace

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The Linux font backend, whose tests here also compare it with CoreText. Only the font
      # crate reads the feature.
      - run: cargo clippy -p benches-font --all-targets --features swash -- -D warnings
      - run: cargo test -p benches-font --features swash

  # Rune has no Linux CI, so this is also the first to catch its Linux regressions. rustfmt checks
  # every file whatever the cfg, so `cargo fmt --check` runs only here, on every change.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # libghostty-vt builds with zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      # What the README's Linux build steps install, less `build-essential`, which the runner has:
      # libxkbcommon to link against (Wayland and fontconfig are loaded at run time), its X11
      # library, and Mesa's Vulkan drivers. Then for the tests: fontconfig and the fonts they
      # expect (the `monospace` family, emoji, and Unifont as a single-face family), and zsh,
      # which they otherwise skip.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 mesa-vulkan-drivers \
            fontconfig fonts-dejavu-core fonts-noto-color-emoji fonts-unifont \
            zsh

      # The default font. The static build, as earlier releases put icons in its private use area.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/monaspace.zip" \
            https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-static-v1.400.zip
          unzip -q "$RUNNER_TEMP/monaspace.zip" -d "$RUNNER_TEMP/monaspace"
          mkdir -p ~/.local/share/fonts
          find "$RUNNER_TEMP/monaspace" -name 'MonaspaceNeon-*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          fc-list | grep MonaspaceNeon-Regular

      # Noto Color Emoji's COLR v1 build, beside the CBDT one apt installs, for the COLR tests. The
      # two share a family name, so the tests find each by file.
      - run: |
          curl -fsSL -o ~/.local/share/fonts/Noto-COLRv1.ttf \
            https://raw.githubusercontent.com/googlefonts/noto-emoji/e20cbc2bbec1926686be9f9bee7d1d2cfa1fea0e/2D/fonts/Noto-COLRv1.ttf
          echo "b8e25ea68db82f9e4d0aee921f4420be2be39887bd5c893a2ad98710531f9d0c  $HOME/.local/share/fonts/Noto-COLRv1.ttf" | sha256sum -c -
          fc-cache -f

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - run: cargo run -- --snap fixture.png --scene fixture --size 620x300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-fixture
          path: fixture.png
          if-no-files-found: error
